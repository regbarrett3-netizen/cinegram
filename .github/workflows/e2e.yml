name: Live site check
on:
  workflow_dispatch:
    inputs:
      run_video:
        description: "Also generate a real AI video (uses fal + ElevenLabs credits)"
        default: "1"
  push:
    branches: [e2e-test]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y >/dev/null && npm i playwright@1 && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run checks
        run: node e2e/live.mjs
        env:
          RUN_VIDEO: ${{ github.event.inputs.run_video || '0' }}
          STATUS_ID: 01a16409-c507-7a93-826d-514bd35f6a2b
          NODE_PATH: e2e/node_modules
      - name: Save results to the e2e-results branch
        if: always()
        run: |
          git config user.name "e2e bot"; git config user.email "e2e@users.noreply.github.com"
          git checkout --orphan e2e-results
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name e2e-out ! -name .git -exec rm -rf {} +
          git add e2e-out && git commit -qm "e2e results $(date -u +%FT%TZ)" && git push -f origin e2e-results
